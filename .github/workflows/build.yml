name: build

on:
  push:
  pull_request:

jobs:
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install PlatformIO
        run: pip install platformio

      - name: Provide dummy secrets
        run: cp include/secrets.h.example include/secrets.h

      - name: Build control panel firmware
        run: pio run

  relay:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/relay/esp32-relay
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install PlatformIO
        run: pip install platformio

      - name: Build relay firmware
        run: pio run

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Syntax check
        run: python3 -m py_compile tools/relay/ble_proxy_macos.py tools/relay/ble_serial_relay.py
