; BLE relay (peripheral side)
;
; Any ESP32 with BLE works. The default target is an ESP32-S3 devkit; change
; "board" for a classic ESP32 (esp32dev) or an ESP32-C3.
;
; The advertised name is set at build time:
;   pio run -t upload -DRELAY_NAME=\"upstair\"

[env:relay]
platform = espressif32@6.8.1
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200

build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DRELAY_NAME=\"downstair\"

lib_deps =
    h2zero/NimBLE-Arduino@1.4.2
